services:
  postgres:
    image: postgres:16
    container_name: ip2p-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env next to this file (not committed)}
      POSTGRES_DB: ip2p
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ip2p_pg_data:/var/lib/postgresql/data
    networks:
      - ip2p_default

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ip2p-backend-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
    depends_on:
      - postgres
    networks:
      - ip2p_default
    volumes:
      - /var/data/ip2p/attachments:/var/data/ip2p/attachments
      - /var/www/pages:/var/www/pages
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:4000
        NEXT_PUBLIC_IP2P_NETWORK: ${IP2P_NETWORK:-testnet}
        NEXT_PUBLIC_PLATFORM_XPUB_BTC: ${NEXT_PUBLIC_PLATFORM_XPUB_BTC:?Set BTC public key}
        NEXT_PUBLIC_PLATFORM_XPUB_LTC: ${NEXT_PUBLIC_PLATFORM_XPUB_LTC:?Set LTC public key}
        NEXT_PUBLIC_PLATFORM_FEE_ADDRESS_BTC: ${NEXT_PUBLIC_PLATFORM_FEE_ADDRESS_BTC:?Set BTC fee address}
        NEXT_PUBLIC_PLATFORM_FEE_ADDRESS_LTC: ${NEXT_PUBLIC_PLATFORM_FEE_ADDRESS_LTC:?Set LTC fee address}
    container_name: ip2p-frontend-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    networks:
      - ip2p_default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ip2p_pg_data:
    name: ip2p_ip2p_pg_data
    external: true

networks:
  ip2p_default:
    external: true
